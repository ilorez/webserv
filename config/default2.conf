server {
    listen 4444;
    host 127.0.0.1;
    server_name monster.com;
    root ./www;
    index index.html index.htm default.html;
    autoindex on;
    client_max_body_size 100M;
    error_page 400 401 403 500 502 503 504 error/exception.html;
    error_page 404 404.html;

    location / {
        allow_methods GET POST;
        index index.html;
        autoindex on;
        client_max_body_size 1M;
    }

    location /api/v1 {
        allow_methods GET POST DELETE;
        client_max_body_size 20M;
        autoindex off;
        return 301 /api/v2;
    }

    location /api/v2 {
        allow_methods GET POST DELETE;
        client_max_body_size 20M;
        autoindex off;
    }

    location "/static" {
        allow_methods GET;
        autoindex on;
        root /var/www/static;
    }

    location /gone {
        return 410 "Check";
    }

    location /redirect {
        return /api/v2;
    }

    location /cgi-bin {
        root ./cgi-bin;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }

    location /upload {
        allow_methods POST;
        upload_store ./uploads;
    }
}
server {
    listen 8080;
    host 127.0.0.1;
    server_name example.com;
    root /var/www/html;
    index index.html;
    autoindex off;
    client_max_body_size 1M;
    error_page 404 /404.html;
    error_page 500 502 503 /50x.html;

    location / {
        allow_methods GET;
        index index.html;
        autoindex off;
    }

    location /old-page {
        return 301 /new-page;
    }

    location /api {
        allow_methods GET POST DELETE;
        client_max_body_size 5M;
        autoindex off;
    }
}

server {
    listen 9090;
    host 127.0.0.1;
    server_name api.example.com;
    root /var/www/api;
    index index.html;
    autoindex on;

    location /public {
        allow_methods GET;
        autoindex on;
    }

    location /gone {
        return 410;
    }
}
