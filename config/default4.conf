server {
    listen 4444;
    host 127.0.0.1;
    server_name monster.com;
    root ./www;
    index index.html index.htm default.html;
    autoindex on;
    client_max_body_size 100M;
    error_page 400 401 403 500 502 503 504 ./www/errorPage.html;
    error_page 404 ./www/404.html;

    location / {
        allow_methods GET POST;
        index index.html;
        autoindex on;
        client_max_body_size 1M;
    }
    location /static {
        allow_methods GET;
        autoindex on;
        root ./www;
        index index.html;
    }
    location /upload {
        allow_methods POST;
        upload_store ./uploads;
    }
    location /cgi-bin {
        allow_methods GET POST;
        root ./cgi-bin;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
    location /gone {
        return 410 "Gone";
    }
    location /redirect {
        return 301 /static;
    }
}

server {
    listen 8080;
    host 127.0.0.1;
    server_name example.com;
    root ./www;
    index index.html;
    autoindex off;
    client_max_body_size 1M;
    error_page 404 ./www/404.html;
    error_page 500 502 503 ./www/errorPage.html;

    location / {
        allow_methods GET;
        index index.html;
        autoindex off;
    }
    location /upload {
        allow_methods POST;
        upload_store ./uploads;
    }
    location /gone {
        return 410 "Gone";
    }
    location /redirect {
        return 301 /;
    }
}

