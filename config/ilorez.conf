server {
    listen 8383;
    host 127.0.0.1;
    server_name edge.webserv.42;
    root ./www;
    index index.html;
    autoindex off;
    client_max_body_size 1M;
    error_page 404 ./404.html;
    error_page 400 403 405 413 ./error.html;
    error_page 500 502 503 504 ./error.html;

    location / {
        allow_methods GET;
        index index.html;
    }

    location /upload {
        allow_methods POST;
        upload_store ./uploads;
        client_max_body_size 1K;
    }

    location /redirect {
        return 301 /;
    }

    location /gone {
        return 410 "Gone";
    }

    location /missing {
        allow_methods GET;
        root ./www/doesnotexist;
    }
}
