server {
    listen 8080;
    host 127.0.0.1;
    server_name main_server.1337;
    root ./;
    index index.html;
    autoindex off;
    client_max_body_size 100M;
    error_page 404 ./www/error/404.html;
    error_page 400 403 405 413 ./www/error/error.html;
    error_page 500 502 503 504 ./www/error/error.html;

    location / {
        allow_methods GET;
        root www;
        index index.html;
        autoindex off;
    }

    location /upload {
        allow_methods GET POST DELETE;
        root uploads;
        upload_store ./uploads;
        autoindex on;
    }

    location /cgi {
        allow_methods GET;
        index index.html;
        root www/cgi;
        autoindex off;
    }

    location /cgi/upload {
        allow_methods POST;
        upload_store ./cgi-bin;
    }

    location /cgi/delete {
        allow_methods DELETE;
        upload_store ./cgi-bin;
    }

    location /cgi/run {
        allow_methods GET POST;
        upload_store ./cgi-bin;
        root cgi-bin;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
    
}
