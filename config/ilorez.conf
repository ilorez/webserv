server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.42;
    root ./www;
    index index.html;
    autoindex off;
    client_max_body_size 100M;
    error_page 404 ./404.html;
    error_page 400 403 405 413 ./error.html;
    error_page 500 502 503 504 ./error.html;

    location / {
        allow_methods GET;
        index index.html;
        autoindex off;
    }

    location /upload {
        allow_methods GET POST DELETE;
        upload_store ./uploads;
        autoindex on;
    }

    location /cgi-bin/upload {
        allow_methods POST;
        upload_store ./cgi-bin;
    }
    
    location /cgi-bin {
        allow_methods GET POST DELETE;
        root ./cgi-bin;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
}

server {
    listen 8181;
    host 127.0.0.1;
    server_name static.webserv.42;
    root ./www;
    index index.html;
    autoindex on;
    client_max_body_size 1M;
    error_page 404 ./www/404.html;
    error_page 400 403 405 ./www/error.html;
    error_page 500 502 503 ./www/error.html;

    location / {
        allow_methods GET;
        autoindex on;
    }

    location /upload {
        allow_methods GET POST DELETE;
        upload_store ./uploads;
        autoindex on;
    }

    location /redirect {
        return 301 /;
    }

    location /gone {
        return 410 "Gone";
    }
}

