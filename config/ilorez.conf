server {
    listen 8080;
    host 127.0.0.1;
    server_name main_server.1337;
    root ./;
    index index.html;
    autoindex off;
    client_max_body_size 100M;
    error_page 404 /error/404.html;
    error_page 400 403 405 413 /error/error.html;
    error_page 500 502 503 504 /error/error.html;

    location / {
        allow_methods GET;
        root www;
        index index.html;
        autoindex off;
    }

    location /dashboard {
      return 301 "/";
    }

    location /api/v1 {
        allow_methods GET POST DELETE;
        root ./www/api;
        client_max_body_size 20M;
        autoindex off;
    }

    location /api/v2 {
        allow_methods GET POST DELETE;
        client_max_body_size 20M;
        autoindex off;
        return 301 /api/v1;
    }

    location /upload {
        allow_methods GET POST DELETE;
        root uploads;
        upload_store ./uploads;
        autoindex on;
    }

    location /cgi {
        allow_methods GET;
        index index.html;
        root www/cgi;
        autoindex off;
    }

    location /cgi-bin {
        allow_methods GET POST DELETE;
        upload_store ./cgi-bin;
        root cgi-bin;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
}
