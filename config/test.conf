server {
    listen 8080;
    host 127.0.0.1;
    server_name main_server.1337;
    root ./;
    index index.html;
    autoindex off;
    client_max_body_size 100M;
    error_page 404 /error/404.html;
    error_page 400 403 405 413 /error/error.html;
    error_page 500 502 503 504 /error/error.html;

    location / {
        allow_methods GET POST;
        root www;
        index index.html;
    }

    location /post_body {
        allow_methods GET POST DELETE;
        root uploads;
        upload_store ./uploads;
        autoindex on;
    }

    location /directory/ {
        allow_methods GET POST;
        index youpi.bad_extension;
        client_max_body_size 100M;
        root ./YoupiBanane;
        cgi_handler .bla ./cgi-tester;
        autoindex off;
    }

}
