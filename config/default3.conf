server {
    host 127.0.0.1;
    port 8080;
    root ../www/;
    index ../www/index.html;

    // basiclocation
    location / {
        root ../www/root/;
    }

    # nested-style paths (not actual nesting, just variety)
    location /api {
        root ../www/api/;
    }

    location /api/v1 {
        root ../www/api/v1/;
        index ../www/api/v1/index.html;
    }

    location /api/v2 {
        root ../www/api/v2/;
    }

    # deep path
    location /a/b/c/d/e {
        root ../deep/path/a/b/c/d/e/;
    }

    # paths with dots and mixed characters
    location /static.files {
        root ../assets/static.files/;
    }

    location /images_v2 {
        root ../assets/images_v2/;
    }

    # multiple directives inside location
    location /admin {
        root ../secure/admin/;
        index ../secure/admin/dashboard.html;
    }

    # tricky spacing
    location    /space    {
        root     ../weird/spacing/   ;
    }

    # comment after code
    location /comment {
        root ../with/comment/; # this is a comment
    }

    # edge: no extra spaces
    location /tight {
        root ../tight/;
    }

    # edge: long path
    location /this/is/a/very/very/very/long/path/that/keeps/going {
        root ../long/path/structure/that/also/keeps/going/and/going/;
    }
}