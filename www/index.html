<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webserv tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1><span>//</span> webserv tester</h1>
  <a class="cgi-btn" href="/cgi">▶ test cgi</a>
</header>

<div class="grid">

  <!-- UPLOAD -->
  <div class="panel">
    <div class="panel-label"><span class="dot dot-green"></span>upload image</div>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".jpg,.jpeg,.png">
      <span class="drop-icon">⬆</span>
      <div class="drop-text">
        <strong>choose or drop a file</strong>
        jpg · jpeg · png
      </div>
    </div>

    <div class="preview-wrap" id="previewWrap">
      <img id="previewImg" src="" alt="preview">
      <div class="file-name" id="fileName"></div>
    </div>

    <div class="result" id="uploadResult"></div>
    <button class="btn btn-green" id="uploadBtn">upload</button>
  </div>

  <!-- GET IMAGE -->
  <div class="panel">
    <div class="panel-label"><span class="dot dot-blue"></span>get image</div>

    <div class="field">
      <label for="getImageName">image name</label>
      <input type="text" id="getImageName" placeholder="photo.jpg">
    </div>

    <button class="btn btn-blue" id="getBtn">fetch</button>
    <div class="result" id="getResult"></div>
  </div>

  <!-- DELETE -->
  <div class="panel delete-panel">
    <div class="panel-label"><span class="dot dot-orange"></span>delete image</div>

    <div class="field">
      <label for="deleteImageName">image name</label>
      <input type="text" id="deleteImageName" placeholder="photo.jpg">
    </div>

    <button class="btn btn-red" id="deleteBtn">delete</button>
    <div class="result" id="deleteResult"></div>
  </div>

</div>

<div class="status-bar">http/1.0 · no keep-alive · epoll</div>

<script src="app.js"></script>
</body>
</html>
