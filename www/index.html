<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>nginx-1.29.6 media upload</title>

<style>
body { background:#0d0d0d; color:#fff; font-family:monospace; padding:30px; }
.panel { border:1px solid #333; padding:15px; margin-bottom:15px; }
input, button { padding:10px; margin-top:10px; }
button { cursor:pointer; }
.green { background:#00ff88; border:none; }
.red { background:#ff3b3b; border:none; }
.blue { background:#4d9fff; border:none; }
</style>
</head>

<body>

<h2>nginx-1.29.6 media test</h2>

<!-- UPLOAD -->
<div class="panel">
  <h3>UPLOAD (RAW BODY)</h3>
  <input type="file" id="file">
  <button class="green" onclick="upload()">upload</button>
</div>

<!-- DELETE -->
<div class="panel">
  <h3>DELETE /upload/filename</h3>
  <input type="text" id="del" placeholder="file.png">
  <button class="red" onclick="del()">delete</button>
</div>

<!-- GET -->
<div class="panel">
  <h3>GET /upload/filename</h3>
  <input type="text" id="get" placeholder="file.png">
  <button class="blue" onclick="getFile()">get</button>
</div>

<pre id="out">ready...</pre>

<script>

function log(t){ document.getElementById("out").textContent = t; }

/* ---------------- UPLOAD RAW ---------------- */
function upload()
{
  const f = document.getElementById("file").files[0];
  if (!f) return log("no file");

  // IMPORTANT: filename must be sent in URL
  fetch("/upload/" + f.name, {
    method: "POST",
    headers: {
      "Content-Type": f.type || "application/octet-stream"
    },
    body: f   // raw binary, NOT FormData
  })
  .then(r => r.text())
  .then(d => log("UPLOAD:\n" + d))
  .catch(e => log(e));
}

/* ---------------- DELETE ---------------- */
function del()
{
  const name = document.getElementById("del").value;
  if (!name) return log("no name");

  fetch("/upload/" + name, {
    method: "DELETE"
  })
  .then(r => r.text())
  .then(d => log("DELETE:\n" + d));
}

/* ---------------- GET ---------------- */
function getFile()
{
  const name = document.getElementById("get").value;
  if (!name) return log("no name");

  fetch("/upload/" + name)
  .then(r => r.blob())
  .then(b => log("SIZE: " + b.size + " bytes"));
}

</script>

</body>
</html>
